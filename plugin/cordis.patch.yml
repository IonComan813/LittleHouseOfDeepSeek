# dsh-little-house bundle layer.
#
# 1. `little-house`: the host-level service (house process + daily free-time slots).
# 2. `preset-little-house`: the agent preset the life session runs. It has no
#    shell, file or web tools on purpose — the resident can only act through
#    the house_* and diary_* tools.
# 3. `preset-little-house-memory`: the daily memory summariser (no persona, no tools).
#    QQ messages (with `qq.enabled: true`) go into the life session itself.
#
# To change settings, override the `little-house` row by id in your profile's
# cordis.patch.yml (a patch replaces the whole `config`, so restate every key
# you want to keep).
- insert:
    - id: little-house
      name: dsh-little-house
      config:
        wake:
          # Free time each day: starts at a random minute between from and to
          # (rolled once a day), lasts `minutes`. `chance` < 1 = only on some days.
          slots:
            - { name: 早上, from: '07:30', to: '08:30', minutes: 40 }
            - { name: 中午, from: '11:30', to: '12:30', minutes: 40 }
            - { name: 傍晚, from: '17:30', to: '18:30', minutes: 40 }
            - { name: 深夜, from: '21:30', to: '22:30', minutes: 40, chance: 0.5 }
          maxActionsPerWake: 40

    - id: preset-little-house
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: little-house
        name: 小屋生活
        description: 小屋居民的生活会话：只能通过 house_* 工具在小屋里行动。
        order: 90
        plugins:
          - id: little-house-agent-scope
            name: dsh-little-house/agent-scope
          - id: little-house-diary
            name: dsh-little-house/diary
            config:
              source: 小屋
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 20000
                  headChars: 16000
                  tailChars: 2000


    # The once-a-day memory summariser: no persona, no tools.
    - id: preset-little-house-memory
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: little-house-memory
        name: 小屋记忆整理
        description: 每天把她前一天的日记和 QQ 聊天整理进记忆（不带人设，不用工具）。
        order: 92
        plugins:
          - id: little-house-memory-scope
            name: dsh-little-house/memory
